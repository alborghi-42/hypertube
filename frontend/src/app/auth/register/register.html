<form class="auth-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <h1>{{ 'register.title' | transloco }}</h1>

  <app-oauth-buttons />

  <label class="field">
    {{ 'fields.email' | transloco }}
    <input
      type="email"
      formControlName="email"
      autocomplete="email"
      [attr.aria-invalid]="controlError(form.controls.email) !== null"
    />
    @if (controlError(form.controls.email); as message) {
      <p class="field-error">{{ message | message }}</p>
    }
  </label>

  <label class="field">
    {{ 'fields.username' | transloco }}
    <input
      type="text"
      formControlName="username"
      autocomplete="username"
      [attr.aria-invalid]="controlError(form.controls.username) !== null"
    />
    @if (controlError(form.controls.username); as message) {
      <p class="field-error">{{ message | message }}</p>
    }
  </label>

  <label class="field">
    {{ 'fields.firstName' | transloco }}
    <input
      type="text"
      formControlName="first_name"
      autocomplete="given-name"
      [attr.aria-invalid]="controlError(form.controls.first_name) !== null"
    />
    @if (controlError(form.controls.first_name); as message) {
      <p class="field-error">{{ message | message }}</p>
    }
  </label>

  <label class="field">
    {{ 'fields.lastName' | transloco }}
    <input
      type="text"
      formControlName="last_name"
      autocomplete="family-name"
      [attr.aria-invalid]="controlError(form.controls.last_name) !== null"
    />
    @if (controlError(form.controls.last_name); as message) {
      <p class="field-error">{{ message | message }}</p>
    }
  </label>

  <label class="field">
    {{ 'fields.password' | transloco }}
    <input
      type="password"
      formControlName="password"
      autocomplete="new-password"
      [attr.aria-invalid]="controlError(form.controls.password) !== null"
    />
    @if (controlError(form.controls.password); as message) {
      <p class="field-error">{{ message | message }}</p>
    } @else {
      <small>{{ 'fields.passwordHint' | transloco }}</small>
    }
  </label>

  @if (formError(); as message) {
    <p class="form-error" role="alert">{{ message | message }}</p>
  }

  <button type="submit" [disabled]="submitting()">
    {{ (submitting() ? 'register.submitting' : 'register.submit') | transloco }}
  </button>

  <p class="switch">
    {{ 'register.already' | transloco }}
    <a routerLink="/login">{{ 'register.login' | transloco }}</a>
  </p>
</form>
