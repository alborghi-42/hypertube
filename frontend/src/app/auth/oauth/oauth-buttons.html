@if (error(); as message) {
  <p class="form-error" role="alert">{{ message | transloco }}</p>
}
<div class="oauth-buttons">
  <a class="oauth-button" [href]="'api/auth/42/start?returnUrl=' + returnUrl()">{{
    'oauth.with42' | transloco
  }}</a>
  <a class="oauth-button" [href]="'api/auth/github/start?returnUrl=' + returnUrl()">{{
    'oauth.withGithub' | transloco
  }}</a>
</div>
<p class="oauth-divider">
  <span>{{ 'common.or' | transloco }}</span>
</p>
