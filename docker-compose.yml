services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hypertube}
      POSTGRES_USER: ${POSTGRES_USER:-hypertube}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-hypertube}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-hypertube}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-hypertube}?sslmode=disable
      PORT: "8080"
      DATA_DIR: /data
    ports:
      - "8080:8080"
      # BitTorrent peers (TORRENT_LISTEN_PORT), TCP+UDP.
      - "${TORRENT_LISTEN_PORT:-6881}:${TORRENT_LISTEN_PORT:-6881}/tcp"
      - "${TORRENT_LISTEN_PORT:-6881}:${TORRENT_LISTEN_PORT:-6881}/udp"
    volumes:
      - ./backend:/app
      - media-data:/data
    depends_on:
      postgres:
        condition: service_healthy

  # Dev SMTP sink for password-reset email; inbox at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npx ng serve --host 0.0.0.0 --proxy-config proxy.conf.docker.json"
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  media-data:
  frontend-node-modules:
